{% set name = "authlib" %}
{% set version = "1.9.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/authlib/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 8bcabc378284f216fb7c13a7311210f81a4d4cd18aebd5ed986a7e85442b17f1

build:
  skip: true  # [py<310]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    # Keep requests at runtime for backward compatibility
    - requests
    - cryptography >=45.0.1
    - joserfc >=1.6.8

# Exclude django: requires pytest-django/pytest-env, which are not available on pkgs/main
{% set ignore_tests = "--ignore=tests/django" %}

test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - authlib
    - authlib.consts
    - authlib.common
    - authlib.integrations
    - authlib.jose
    - authlib.oauth1
    - authlib.oauth2
    - authlib.oidc
  requires:
    - pip
    - pytest
    - pytest-asyncio
    - python-multipart
    - flask
    - flask-sqlalchemy
    - django
    - cachelib
    - httpx
    - httpx2 >=2.0
    - starlette
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - set DJANGO_SETTINGS_MODULE=tests.django_settings  # [win]
    - export DJANGO_SETTINGS_MODULE=tests.django_settings  # [unix]
    - pytest -vv tests {{ ignore_tests }}

about:
  home: https://authlib.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: The ultimate Python library in building OAuth and OpenID Connect servers. JWS,JWE,JWK,JWA,JWT included. https://authlib.org
  description: |
    The ultimate Python library in building OAuth and OpenID Connect servers.
    It is designed from low level specifications implementations to high level frameworks integrations,
    to meet the needs of everyone.
  doc_url: https://docs.authlib.org
  dev_url: https://github.com/authlib/authlib

extra:
  recipe-maintainers:
    - chrisburr
    - markfennema
